[project]
name = "ryo-arena"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
    "vadersentiment>=3.3.2",
]

[project.scripts]
arena = "arena.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

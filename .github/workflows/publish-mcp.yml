name: publish-mcp

# Publishes server.json to the official MCP registry. OIDC rather than the interactive device flow:
# the workflow's own identity token proves the repository owner, which is exactly what the registry
# checks for an `io.github.<owner>/` namespace, so nobody has to be at a keyboard to type a code
# before it expires.
#
# The registry makes a published version immutable, so every run needs a `version` in server.json
# that has not been published before. server.json is the single source of that number: a tag is only
# a trigger, never a second place to keep it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  publish:
    # The namespace is io.github.PugarHuda/nota, so only that owner's repository can claim it. On the
    # organiser's mirror this would fail authentication rather than do nothing quietly.
    if: github.repository == 'PugarHuda/nota'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        # A fixed release, checked against the sha256 its release page publishes (registry_1.8.1_checksums.txt),
        # so this OIDC-holding job never runs a binary nobody looked at. Bump both together.
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: The endpoint the entry advertises must actually answer
        # A remote server must be publicly reachable at the URL it registers. Listing a dead endpoint
        # is worse than not listing at all, and the version that did it could never be taken back.
        run: |
          url=$(jq -r '.remotes[0].url' server.json)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          echo "$url answered $code"
          [ "$code" = "200" ] || { echo "::error::refusing to publish: $url answered $code"; exit 1; }

      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

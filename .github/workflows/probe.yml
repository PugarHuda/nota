name: probe

# Captures raw responses from public market APIs that some networks cannot reach (Deribit is
# DNS-blocked on the machine this project is built on), so a test fixture is a real answer rather
# than one typed from documentation. Run by hand; the JSON comes back as a workflow artifact:
#
#   gh workflow run probe.yml -f currency=BTC
#   gh run download <run-id> -n probe
#
# Read-only GETs against keyless public endpoints; nothing here touches a secret.

on:
  workflow_dispatch:
    inputs:
      currency:
        description: "Deribit DVOL currency (BTC or ETH)"
        required: false
        default: "BTC"
        type: choice
        options: ["BTC", "ETH"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public endpoints
        env:
          CURRENCY: ${{ inputs.currency }}
        run: |
          mkdir -p probe
          now=$(( $(date +%s) * 1000 ))
          start=$(( now - 3 * 86400000 ))
          lc=$(echo "$CURRENCY" | tr '[:upper:]' '[:lower:]')
          curl -fsS --max-time 30 "https://www.deribit.com/api/v2/public/get_volatility_index_data?currency=${CURRENCY}&resolution=1D&start_timestamp=${start}&end_timestamp=${now}" -o "probe/deribit_dvol_${lc}.json"
          curl -fsS --max-time 30 "https://gamma-api.polymarket.com/markets?limit=20&active=true&closed=false&tag_slug=crypto" -o probe/polymarket_markets.json
          curl -fsS --max-time 30 "https://api.elections.kalshi.com/trade-api/v2/markets?limit=20&status=open&series_ticker=KXBTCD" -o probe/kalshi_markets.json
          # crowd_odds' two reads: the dated "above" ladder a week out, and Kalshi's weekly ladder around it
          day=$(date -u -d "+7 days" +"%B-%-d-%Y" | tr '[:upper:]' '[:lower:]')
          curl -fsS --max-time 30 "https://gamma-api.polymarket.com/events?slug=bitcoin-above-on-${day}" -o probe/polymarket_bitcoin_above.json
          curl -fsS --max-time 30 "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXBTCD&status=open&limit=1000&min_close_ts=$(( now / 1000 + 6 * 86400 ))&max_close_ts=$(( now / 1000 + 8 * 86400 ))" -o probe/kalshi_kxbtcd_week.json
          ls -l probe
          head -c 400 "probe/deribit_dvol_${lc}.json"; echo

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe
          path: probe/
          retention-days: 7
